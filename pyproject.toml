[project]
name = "intelligent-cctv-surveillance"
version = "0.1.0"
description = "An Intelligent CCTV Surveillance System Using YOLO, ByteTrack, CNN-LSTM and Face Recognition for Automated Threat Detection"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.1.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0,<2.0.0",
    "pyyaml>=6.0.1",
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.18.0,<=1.20.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
