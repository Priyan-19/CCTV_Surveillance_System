version: '1.0'
description: Sample test clips inventory for Phases 0 to 3. Quarantined from training data.
clips:
  - file: sample_walking_01.mp4
    source_dataset: CAVIAR
    original_name: Walk1.mp4
    resolution: 384x288
    fps: 24.48
    frame_count: 612
    duration_seconds: 25.0
    scenario: walking_single
    camera_id: cam_walk_01
    expected_events: One person walking down corridor into restricted zone and returning across tripwire.
    ground_truth_events:
      - event_type: "LINE_CROSSING"
        approx_timestamp: 2.94
        tolerance_seconds: 3.0
      - event_type: "RESTRICTED_ZONE_ENTRY"
        approx_timestamp: 15.03
        tolerance_seconds: 4.0

  - file: sample_walking_02.mp4
    source_dataset: CAVIAR
    original_name: Walk2.mp4
    resolution: 384x288
    fps: 24.7
    frame_count: 1056
    duration_seconds: 42.76
    scenario: walking_pair
    camera_id: cam_walk_02
    expected_events: Two pedestrians walking in lobby. Validates multi-target tracking without ID swap.
    ground_truth_events: []

  - file: sample_abandoned_bag_01.mp4
    source_dataset: CAVIAR
    original_name: LeftBag.mp4
    resolution: 384x288
    fps: 24.78
    frame_count: 1440
    duration_seconds: 58.12
    scenario: abandoned_object_wall
    camera_id: cam_bag_01
    expected_events: Person drops backpack on floor near wall. Small resolution limits COCO detector.
    ground_truth_events: []

  - file: sample_abandoned_bag_02.mp4
    source_dataset: CAVIAR
    original_name: LeftBag_AtChair.mp4
    resolution: 288x384
    fps: 24.73
    frame_count: 1115
    duration_seconds: 45.08
    scenario: abandoned_object_chair
    camera_id: cam_bag_02
    expected_events: Person drops bag beside waiting chairs and leaves scene.
    ground_truth_events: []

  - file: sample_abandoned_bag_hd.mp4
    source_dataset: ABODA
    original_name: video1.mp4
    resolution: 640x480
    fps: 29.97
    frame_count: 2189
    duration_seconds: 73.04
    scenario: abandoned_object_hd
    camera_id: cam_abandoned_hd
    expected_events: Unattended bag scenario at 640x480 resolution (meets 640px YOLO baseline).
    ground_truth_events:
      - event_type: "ABANDONED_OBJECT"
        approx_timestamp: 52.69
        tolerance_seconds: 5.0

  - file: sample_fight_01.mp4
    source_dataset: CAVIAR
    original_name: Fight_RunAway1.mp4
    resolution: 384x288
    fps: 24.47
    frame_count: 551
    duration_seconds: 22.52
    scenario: fighting_and_running
    camera_id: cam_fight_01
    expected_events: Two individuals meet, fight briefly, then separate and run away. Triggers OCCUPANCY_EXCEEDED (limit=1).
    ground_truth_events:
      - event_type: "OCCUPANCY_EXCEEDED"
        approx_timestamp: 13.45
        tolerance_seconds: 3.0

  - file: sample_normal_01.mp4
    source_dataset: CAVIAR
    original_name: Walk3.mp4
    resolution: 384x288
    fps: 24.77
    frame_count: 1380
    duration_seconds: 55.72
    scenario: normal_pedestrians
    camera_id: cam_walk_01
    expected_events: Multiple individuals walking and crossing paths peacefully. Negative control (FP verification).
    ground_truth_events: []
