# Threat Engine Configuration
# Conforms strictly to docs/05_THREAT_ENGINE_SPEC.md and approved design clarifications.

correlation:
  # Maximum time window in seconds between related events to link into the same incident
  time_window_seconds: 120.0
  # Quiet period in seconds with no new events before closing an active incident
  quiet_period_seconds: 300.0
  # Maximum time in seconds to hold an UNKNOWN_PERSON context event in pending buffer
  pending_unknown_buffer_seconds: 10.0
  # Active correlation keys within the camera
  correlation_keys:
    - track_id
    - person_id
    - object_id
    - location

# Base weights assigned per unique event type (docs/05 Section 5.1)
# Note: Rule-based and model-based LOITERING merge into a single unique type.
event_weights:
  FIGHTING: 50
  RESTRICTED_ZONE_ENTRY: 40
  ABANDONED_OBJECT: 30
  LINE_CROSSING: 20
  LOITERING: 20
  PROLONGED_STAY: 15
  OCCUPANCY_EXCEEDED: 15
  RUNNING: 10

# Score modifiers applied to the sum of unique event weights (docs/05 Section 5.2)
modifiers:
  # Clarification (b): Unknown identity penalty stratified by biometric quality
  unknown_verified_penalty: 15        # Verified non-match: usable face compared against gallery
  unknown_no_usable_face_penalty: 5   # Low resolution / blur rejection (e.g. overhead wide cameras)
  pending_penalty: 0                  # Track still evaluating; no modifier applied

  # Clarification (c): Known and authorized deduction
  known_authorized_bonus: -20         # Deducted only if every person event occurred in an authorized zone

  # Multi-event escalation
  distinct_event_types_threshold: 3
  distinct_event_types_penalty: 10    # 3 or more distinct event types in one incident

  # Spatial escalation
  high_risk_zone_penalty: 10          # Triggered when any event occurs in a zone marked high_risk: True

  # Clarification (a): Repeated event modifier
  repeated_event_type_multiplier: 0.25 # +25% of highest-weight repeated event type, applied once per incident

# Incident classification tiers (docs/05 Section 5.4)
severity_levels:
  low:
    min_score: 0
    max_score: 29
    action: "log_only"
  medium:
    min_score: 30
    max_score: 59
    action: "dashboard_alert"
  high:
    min_score: 60
    max_score: 79
    action: "dashboard_alert_and_evidence_notification"
  critical:
    min_score: 80
    max_score: 100
    action: "priority_alert_and_evidence_notification"
